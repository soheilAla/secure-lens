[[rules]]
id = "jwt"
provider = "Generic"
category = "hardcoded_credential"
name = "JSON Web Token"
severity = "medium"
regex = '\bey[A-Za-z0-9_-]{10,}\.ey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
samples.positive = [
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c",
]
samples.negative = [
  "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0",
]

[[rules]]
id = "pem-private-key-header"
provider = "Generic"
category = "hardcoded_credential"
name = "PEM private key block"
severity = "critical"
regex = '-----BEGIN [A-Z0-9 ]*PRIVATE KEY(?: BLOCK)?-----'
samples.positive = [
  "-----BEGIN PRIVATE KEY-----",
  "-----BEGIN RSA PRIVATE KEY-----",
  "-----BEGIN OPENSSH PRIVATE KEY-----",
]
samples.negative = [
  "-----BEGIN CERTIFICATE-----",
]

[[rules]]
id = "database-url-with-credentials"
provider = "Generic"
category = "hardcoded_credential"
name = "Connection URL embedding credentials"
severity = "high"
regex = '[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:@/]+:[^\s@]+@'
samples.positive = [
  "DATABASE_URL=postgres://admin:S3cr3t_Pa55@db.internal:5432/prod",
  "MONGO_URI=mongodb://root:hunter2@10.0.0.5:27017/main",
]
samples.negative = [
  "postgres://db.internal:5432/prod",
  "https://example.com/path",
  "https://user@example.com/feed",
]

[[rules]]
id = "sentry-auth-token"
provider = "Sentry"
category = "hardcoded_credential"
name = "Auth token"
severity = "high"
regex = '\bsntrys_[A-Za-z0-9_-]{40,}\b'
samples.positive = [
  "sntrys_aB3xY9zW2qN5rT8uV1mK4j7XcP6dH2fL0sGnQwZ5vR8",
]
samples.negative = [
  "sntrys_short",
]
