# All sample values are synthetic. GitHub push protection alerts on this file are known false positives by design.

[[rules]]
id = "aws-access-key-id"
provider = "AWS"
category = "hardcoded_credential"
name = "Access key ID"
severity = "high"
regex = '\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b'
samples.positive = [
  "AKIAIOSFODNN7EXAMPLE",
  "ASIAABCDEFGHIJKLMNOP",
]
samples.negative = [
  "AKIA123",
  "XAKIAIOSFODNN7EXAMPLE",
]

[[rules]]
id = "google-api-key"
provider = "Google"
category = "hardcoded_credential"
name = "API key"
severity = "high"
regex = '\bAIza[0-9A-Za-z_-]{35}\b'
samples.positive = [
  "AIzaAa1_-Bb2Cc3Dd4Ee5Ff6Gg7Hh8Ii9Jj0KkM",
]
samples.negative = [
  "AIza123",
  "XAIzaAa1_-Bb2Cc3Dd4Ee5Ff6Gg7Hh8Ii9Jj0Kk",
]

[[rules]]
id = "github-pat-classic"
provider = "GitHub"
category = "hardcoded_credential"
